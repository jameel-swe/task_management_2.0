services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres -d task_management'], interval: 5s, timeout: 5s, retries: 10 }
  temporal:
    image: temporalio/auto-setup:1.25.0
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    ports: ['7233:7233']
    depends_on: { postgres: { condition: service_healthy } }
  temporal-ui:
    image: temporalio/ui:2.31.2
    environment: { TEMPORAL_ADDRESS: temporal:7233 }
    ports: ['8233:8080']
    depends_on: [temporal]
  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/task_management
      JWT_SECRET: local-access-secret
      JWT_REFRESH_SECRET: local-refresh-secret
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: task-management
    ports: ['3000:3000']
    depends_on: { postgres: { condition: service_healthy }, temporal: { condition: service_started } }
    command: sh -c 'node dist/main.js'
  worker:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/task_management
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: task-management
    depends_on: { postgres: { condition: service_healthy }, temporal: { condition: service_started } }
    command: sh -c 'node dist/temporal/worker.js'
